<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 940" width="1640" height="940" font-family="Times New Roman, Times, serif"><title>ИНГОССЕМЬЯ: сервисный блупринт</title><rect width="1640" height="940" fill="#FFFFFF"/><rect x="0" y="0" width="1640" height="78" rx="0" fill="#0A2A8A"/><rect x="0" y="78" width="1640" height="5" rx="0" fill="#B8F02A"/><text x="36" y="38" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start">ИНГОССЕМЬЯ: сервисный блупринт</text><text x="36" y="64" font-size="14" font-weight="400" fill="#C9D3FA" text-anchor="start">Дорожки действий клиентов, фронт-офиса и бэк-офиса, линии взаимодействия и видимости</text><rect x="223.0" y="104" width="196" height="44" rx="8" fill="#1E3FD8"/><circle cx="244" cy="126.0" r="13" fill="#B8F02A"/><text x="244" y="131.0" font-size="14" font-weight="700" fill="#151B33" text-anchor="middle">1</text><text x="262" y="131.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Триггер</text><rect x="425.0" y="104" width="196" height="44" rx="8" fill="#1E3FD8"/><circle cx="446" cy="126.0" r="13" fill="#B8F02A"/><text x="446" y="131.0" font-size="14" font-weight="700" fill="#151B33" text-anchor="middle">2</text><text x="464" y="131.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Подключение</text><rect x="627.0" y="104" width="196" height="44" rx="8" fill="#1E3FD8"/><circle cx="648" cy="126.0" r="13" fill="#B8F02A"/><text x="648" y="131.0" font-size="14" font-weight="700" fill="#151B33" text-anchor="middle">3</text><text x="666" y="131.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Знакомство</text><rect x="829.0" y="104" width="196" height="44" rx="8" fill="#1E3FD8"/><circle cx="850" cy="126.0" r="13" fill="#B8F02A"/><text x="850" y="131.0" font-size="14" font-weight="700" fill="#151B33" text-anchor="middle">4</text><text x="868" y="131.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Ритм</text><rect x="1031.0" y="104" width="196" height="44" rx="8" fill="#1E3FD8"/><circle cx="1052" cy="126.0" r="13" fill="#B8F02A"/><text x="1052" y="131.0" font-size="14" font-weight="700" fill="#151B33" text-anchor="middle">5</text><text x="1070" y="131.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Действие</text><rect x="1233.0" y="104" width="196" height="44" rx="8" fill="#1E3FD8"/><circle cx="1254" cy="126.0" r="13" fill="#B8F02A"/><text x="1254" y="131.0" font-size="14" font-weight="700" fill="#151B33" text-anchor="middle">6</text><text x="1272" y="131.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Ценность</text><rect x="1435.0" y="104" width="196" height="44" rx="8" fill="#1E3FD8"/><circle cx="1456" cy="126.0" r="13" fill="#B8F02A"/><text x="1456" y="131.0" font-size="14" font-weight="700" fill="#151B33" text-anchor="middle">7</text><text x="1474" y="131.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Возврат</text><rect x="30" y="154" width="184" height="90" rx="8" fill="#0A2A8A"/><text x="38" y="204.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Действия ребенка</text><rect x="223.0" y="154" width="196" height="90" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="231.0" y="177.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Видит предложение</text><rect x="425.0" y="154" width="196" height="90" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="433.0" y="177.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Профиль родителя в</text><text x="433.0" y="197.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">боте, оплата</text><rect x="627.0" y="154" width="196" height="90" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="635.0" y="177.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Ждет подтверждения</text><rect x="829.0" y="154" width="196" height="90" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="837.0" y="177.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Читает тревожные</text><text x="837.0" y="197.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">сигналы</text><rect x="1031.0" y="154" width="196" height="90" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="1039.0" y="177.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Подтверждает запись</text><rect x="1233.0" y="154" width="196" height="90" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="1241.0" y="177.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Читает отчет в чате</text><rect x="1435.0" y="154" width="196" height="90" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="1443.0" y="177.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Смотрит сводку, решает</text><text x="1443.0" y="197.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">про ДМС</text><rect x="30" y="250" width="184" height="100" rx="8" fill="#0A2A8A"/><text x="38" y="305.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Действия родителя</text><rect x="223.0" y="250" width="196" height="100" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="231.0" y="273.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Обострение или</text><text x="231.0" y="293.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">плановый визит</text><rect x="425.0" y="250" width="196" height="100" rx="8" fill="#FAFBFF" stroke="#DCE3FB" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="627.0" y="250" width="196" height="100" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="635.0" y="273.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Подписывает согласие:</text><text x="635.0" y="293.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">СМС-код или бумага</text><rect x="829.0" y="250" width="196" height="100" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="837.0" y="273.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Отвечает на звонки</text><text x="837.0" y="293.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">робота и координатора</text><rect x="1031.0" y="250" width="196" height="100" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="1039.0" y="273.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Идет к врачу, принимает</text><text x="1039.0" y="293.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">медсестру</text><rect x="1233.0" y="250" width="196" height="100" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="1241.0" y="273.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Получает рекомендации</text><rect x="1435.0" y="250" width="196" height="100" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="1443.0" y="273.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Решает, что видит</text><text x="1443.0" y="293.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">ребенок</text><line x1="30" y1="362" x2="1634" y2="362" stroke="#0A2A8A" stroke-width="2" stroke-dasharray="8 5"/><text x="1630" y="378" font-size="12" font-weight="700" fill="#0A2A8A" text-anchor="end">Линия взаимодействия: клиент видит и контактирует</text><rect x="30" y="386" width="184" height="130" rx="8" fill="#0A2A8A"/><text x="38" y="447.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Фронт: бот, робот,</text><text x="38" y="465.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">координатор</text><rect x="223.0" y="386" width="196" height="130" rx="8" fill="#E4FAB8" stroke="#8FA3F0" stroke-width="1.5"/><text x="231.0" y="409.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Бот: описание услуги и</text><text x="231.0" y="429.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">цены</text><rect x="425.0" y="386" width="196" height="130" rx="8" fill="#E4FAB8" stroke="#8FA3F0" stroke-width="1.5"/><text x="433.0" y="409.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Бот: анкета, льгота, оплата.</text><text x="433.0" y="429.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Координатор:</text><text x="433.0" y="449.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">приветствие</text><rect x="627.0" y="386" width="196" height="130" rx="8" fill="#E4FAB8" stroke="#8FA3F0" stroke-width="1.5"/><text x="635.0" y="409.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Координатор: звонок,</text><text x="635.0" y="429.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">представление, график</text><text x="635.0" y="449.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">звонков</text><rect x="829.0" y="386" width="196" height="130" rx="8" fill="#E4FAB8" stroke="#8FA3F0" stroke-width="1.5"/><text x="837.0" y="409.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Робот: ежедневный</text><text x="837.0" y="429.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">звонок. Координатор: раз</text><text x="837.0" y="449.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">в месяц и по флагу</text><text x="837.0" y="469.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">(Расширенный: каждую</text><text x="837.0" y="489.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">неделю)</text><rect x="1031.0" y="386" width="196" height="130" rx="8" fill="#E4FAB8" stroke="#8FA3F0" stroke-width="1.5"/><text x="1039.0" y="409.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Координатор: запись в</text><text x="1039.0" y="429.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">ОМС или клинику, заказ</text><text x="1039.0" y="449.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">выезда</text><rect x="1233.0" y="386" width="196" height="130" rx="8" fill="#E4FAB8" stroke="#8FA3F0" stroke-width="1.5"/><text x="1241.0" y="409.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Бот: отчет. Координатор:</text><text x="1241.0" y="429.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">комментарий</text><rect x="1435.0" y="386" width="196" height="130" rx="8" fill="#E4FAB8" stroke="#8FA3F0" stroke-width="1.5"/><text x="1443.0" y="409.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Бот: сводка.</text><text x="1443.0" y="429.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Координатор:</text><text x="1443.0" y="449.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">предложение продуктов</text><line x1="30" y1="528" x2="1634" y2="528" stroke="#0A2A8A" stroke-width="2" stroke-dasharray="8 5"/><text x="1630" y="544" font-size="12" font-weight="700" fill="#0A2A8A" text-anchor="end">Линия видимости: ниже клиент не видит</text><rect x="30" y="552" width="184" height="150" rx="8" fill="#1E3FD8"/><text x="38" y="614.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Бэк: CRM,</text><text x="38" y="632.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">телемедицина,</text><text x="38" y="650.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">клиники, IngoRead</text><rect x="223.0" y="552" width="196" height="150" rx="8" fill="#DCE3FB" stroke="#8FA3F0" stroke-width="1.5"/><text x="231.0" y="575.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">CRM: карточка лида,</text><text x="231.0" y="595.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">источник</text><rect x="425.0" y="552" width="196" height="150" rx="8" fill="#DCE3FB" stroke="#8FA3F0" stroke-width="1.5"/><text x="433.0" y="575.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">CRM: семья, подписка,</text><text x="433.0" y="595.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">платеж. Контур ПДн УЗ-1</text><rect x="627.0" y="552" width="196" height="150" rx="8" fill="#DCE3FB" stroke="#8FA3F0" stroke-width="1.5"/><text x="635.0" y="575.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">CRM: согласие и график.</text><text x="635.0" y="595.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Юристы: форма согласия</text><rect x="829.0" y="552" width="196" height="150" rx="8" fill="#DCE3FB" stroke="#8FA3F0" stroke-width="1.5"/><text x="837.0" y="575.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Робот пишет флаги в</text><text x="837.0" y="595.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">CRM. Телемедицина:</text><text x="837.0" y="615.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">дежурный врач</text><rect x="1031.0" y="552" width="196" height="150" rx="8" fill="#DCE3FB" stroke="#8FA3F0" stroke-width="1.5"/><text x="1039.0" y="575.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">МедРокет: согласование.</text><text x="1039.0" y="595.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Клиники ДМС,</text><text x="1039.0" y="615.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">лаборатории, партнеры</text><rect x="1233.0" y="552" width="196" height="150" rx="8" fill="#DCE3FB" stroke="#8FA3F0" stroke-width="1.5"/><text x="1241.0" y="575.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">IngoRead: разбор</text><text x="1241.0" y="595.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">выписок в медкарту</text><rect x="1435.0" y="552" width="196" height="150" rx="8" fill="#DCE3FB" stroke="#8FA3F0" stroke-width="1.5"/><text x="1443.0" y="575.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">CRM: когорты. ДМС и</text><text x="1443.0" y="595.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Ингосстрах Жизнь</text><line x1="30" y1="714" x2="1634" y2="714" stroke="#0A2A8A" stroke-width="2" stroke-dasharray="8 5"/><text x="1630" y="730" font-size="12" font-weight="700" fill="#0A2A8A" text-anchor="end">Линия внутренней поддержки: управление и контроль</text><rect x="30" y="738" width="184" height="84" rx="8" fill="#8FA3F0"/><text x="38" y="785.0" font-size="14" font-weight="700" fill="#151B33" text-anchor="start">Поддержка</text><rect x="223.0" y="738" width="196" height="84" rx="8" fill="#F3F5FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="231.0" y="761.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Маркетинг,</text><text x="231.0" y="781.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">B2B2C-каналы</text><rect x="425.0" y="738" width="196" height="84" rx="8" fill="#F3F5FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="433.0" y="761.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Платежи сервисной</text><text x="433.0" y="781.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">компании группы,</text><text x="433.0" y="801.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">эквайринг</text><rect x="627.0" y="738" width="196" height="84" rx="8" fill="#F3F5FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="635.0" y="761.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Обучение и скрипты</text><text x="635.0" y="781.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">координаторов</text><rect x="829.0" y="738" width="196" height="84" rx="8" fill="#F3F5FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="837.0" y="761.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Супервизия, резерв</text><text x="837.0" y="781.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">операторов</text><rect x="1031.0" y="738" width="196" height="84" rx="8" fill="#F3F5FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="1039.0" y="761.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Договоры с</text><text x="1039.0" y="781.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">лабораториями</text><rect x="1233.0" y="738" width="196" height="84" rx="8" fill="#F3F5FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="1241.0" y="761.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Контроль качества</text><text x="1241.0" y="781.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">отчетов</text><rect x="1435.0" y="738" width="196" height="84" rx="8" fill="#F3F5FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="1443.0" y="761.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Аналитика H1-H6</text></svg>