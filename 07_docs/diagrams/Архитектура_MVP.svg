<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 960" width="1640" height="960" font-family="Times New Roman, Times, serif"><title>ИНГОССЕМЬЯ: архитектура MVP</title><rect width="1640" height="960" fill="#FFFFFF"/><rect x="0" y="0" width="1640" height="78" rx="0" fill="#0A2A8A"/><rect x="0" y="78" width="1640" height="5" rx="0" fill="#B8F02A"/><text x="36" y="38" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start">ИНГОССЕМЬЯ: архитектура MVP</text><text x="36" y="64" font-size="14" font-weight="400" fill="#C9D3FA" text-anchor="start">Новое собираем на конструкторах. Оператор сервиса: сервисная компания группы Ингосстрах</text><rect x="30" y="100" width="30" height="20" rx="4" fill="#E4FAB8" stroke="#0A2A8A" stroke-width="1.5"/><text x="70" y="115" font-size="14" font-weight="400" fill="#151B33" text-anchor="start">Новое в MVP (конструктор, скрипты)</text><rect x="450" y="100" width="30" height="20" rx="4" fill="#DCE3FB" stroke="#1E3FD8" stroke-width="1.5"/><text x="490" y="115" font-size="14" font-weight="400" fill="#151B33" text-anchor="start">Уже есть у Ингосстраха, переиспользуем</text><rect x="870" y="100" width="30" height="20" rx="4" fill="#FFFFFF" stroke="#1E3FD8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="910" y="115" font-size="14" font-weight="400" fill="#151B33" text-anchor="start">После MVP</text><rect x="30" y="140" width="1580" height="790" rx="14" fill="#FFFFFF" stroke="#1E3FD8" stroke-width="2" stroke-dasharray="6 4"/><rect x="44" y="130" width="540" height="22" rx="6" fill="#1E3FD8"/><text x="54" y="146" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start">Защищенный контур ПДн УЗ-1 (медданные, согласия)</text><rect x="30" y="165" width="150" height="120" rx="8" fill="#0A2A8A"/><text x="38" y="230.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Каналы</text><rect x="200.0" y="165" width="337.0" height="120" rx="8" fill="#E4FAB8" stroke="#0A2A8A" stroke-width="1.5"/><text x="208.0" y="191.5" font-size="18" font-weight="700" fill="#0A2A8A" text-anchor="start">MAX</text><text x="208.0" y="215.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">Чат-бот на конструкторе и</text><text x="208.0" y="236.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">мини-приложение</text><rect x="551.0" y="165" width="337.0" height="120" rx="8" fill="#DCE3FB" stroke="#1E3FD8" stroke-width="1.5"/><text x="559.0" y="191.5" font-size="18" font-weight="700" fill="#0A2A8A" text-anchor="start">СМС</text><text x="559.0" y="215.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">Код согласия (ПЭП), уведомления</text><rect x="902.0" y="165" width="337.0" height="120" rx="8" fill="#DCE3FB" stroke="#1E3FD8" stroke-width="1.5"/><text x="910.0" y="191.5" font-size="18" font-weight="700" fill="#0A2A8A" text-anchor="start">Телефон</text><text x="910.0" y="215.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">Звонки родителю: обычная связь</text><rect x="1253.0" y="165" width="337.0" height="120" rx="8" fill="#FFFFFF" stroke="#1E3FD8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1261.0" y="191.5" font-size="18" font-weight="700" fill="#0A2A8A" text-anchor="start">IngoMobile</text><text x="1261.0" y="215.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">Витрина и оплата после MVP</text><rect x="30" y="305" width="150" height="130" rx="8" fill="#0A2A8A"/><text x="38" y="375.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Новое в MVP</text><rect x="200.0" y="305" width="337.0" height="130" rx="8" fill="#E4FAB8" stroke="#0A2A8A" stroke-width="1.5"/><text x="208.0" y="331.5" font-size="18" font-weight="700" fill="#0A2A8A" text-anchor="start">Бот-оркестратор</text><text x="208.0" y="355.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">Анкета родителя, оплата, отчеты, сводки</text><rect x="551.0" y="305" width="337.0" height="130" rx="8" fill="#E4FAB8" stroke="#0A2A8A" stroke-width="1.5"/><text x="559.0" y="331.5" font-size="18" font-weight="700" fill="#0A2A8A" text-anchor="start">Сценарий робота</text><text x="559.0" y="355.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">Ежедневный звонок: самочувствие,</text><text x="559.0" y="376.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">лекарства, флаг тревоги</text><rect x="902.0" y="305" width="337.0" height="130" rx="8" fill="#E4FAB8" stroke="#0A2A8A" stroke-width="1.5"/><text x="910.0" y="331.5" font-size="18" font-weight="700" fill="#0A2A8A" text-anchor="start">Рабочее место координатора</text><text x="910.0" y="355.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">Скрипты, чек-листы, очередь перезвонов,</text><text x="910.0" y="376.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">отчет в один клик</text><rect x="1253.0" y="305" width="337.0" height="130" rx="8" fill="#E4FAB8" stroke="#0A2A8A" stroke-width="1.5"/><text x="1261.0" y="331.5" font-size="18" font-weight="700" fill="#0A2A8A" text-anchor="start">Аналитика H1-H6</text><text x="1261.0" y="355.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">Конверсия, согласия, нагрузка, продления</text><rect x="30" y="455" width="150" height="150" rx="8" fill="#0A2A8A"/><text x="38" y="525.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Сервисы</text><text x="38" y="545.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Ингосстраха</text><rect x="200.0" y="455" width="337.0" height="150" rx="8" fill="#DCE3FB" stroke="#1E3FD8" stroke-width="1.5"/><text x="208.0" y="481.5" font-size="18" font-weight="700" fill="#0A2A8A" text-anchor="start">Контакт-центр и голосовой робот</text><text x="208.0" y="505.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">Операторы ДМС становятся</text><text x="208.0" y="526.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">координаторами. Платформа робота уже</text><text x="208.0" y="547.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">работает (CX World Awards 2025)</text><rect x="551.0" y="455" width="337.0" height="150" rx="8" fill="#DCE3FB" stroke="#1E3FD8" stroke-width="1.5"/><text x="559.0" y="481.5" font-size="18" font-weight="700" fill="#0A2A8A" text-anchor="start">Телемедицина</text><text x="559.0" y="505.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">Дежурный врач берет на себя</text><text x="559.0" y="526.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">медицинскую оценку</text><rect x="902.0" y="455" width="337.0" height="150" rx="8" fill="#DCE3FB" stroke="#1E3FD8" stroke-width="1.5"/><text x="910.0" y="481.5" font-size="18" font-weight="700" fill="#0A2A8A" text-anchor="start">Клиники ДМС и Будь здоров</text><text x="910.0" y="505.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">Запись, анализы, выезд медсестры</text><rect x="1253.0" y="455" width="337.0" height="150" rx="8" fill="#DCE3FB" stroke="#1E3FD8" stroke-width="1.5"/><text x="1261.0" y="481.5" font-size="18" font-weight="700" fill="#0A2A8A" text-anchor="start">МедРокет</text><text x="1261.0" y="505.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">Единая платформа согласования с</text><text x="1261.0" y="526.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">клиниками</text><rect x="30" y="625" width="150" height="130" rx="8" fill="#0A2A8A"/><text x="38" y="695.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Данные и ИИ</text><rect x="200.0" y="625" width="337.0" height="130" rx="8" fill="#DCE3FB" stroke="#1E3FD8" stroke-width="1.5"/><text x="208.0" y="651.5" font-size="18" font-weight="700" fill="#0A2A8A" text-anchor="start">CRM</text><text x="208.0" y="675.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">Карточка семьи, статусы, журнал</text><text x="208.0" y="696.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">контактов</text><rect x="551.0" y="625" width="337.0" height="130" rx="8" fill="#DCE3FB" stroke="#1E3FD8" stroke-width="1.5"/><text x="559.0" y="651.5" font-size="18" font-weight="700" fill="#0A2A8A" text-anchor="start">IngoRead</text><text x="559.0" y="675.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">Разбор выписок и протоколов, медкарта</text><text x="559.0" y="696.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">родителя</text><rect x="902.0" y="625" width="337.0" height="130" rx="8" fill="#DCE3FB" stroke="#1E3FD8" stroke-width="1.5"/><text x="910.0" y="651.5" font-size="18" font-weight="700" fill="#0A2A8A" text-anchor="start">Платежи и эквайринг</text><text x="910.0" y="675.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">Подписку продает сервисная компания</text><text x="910.0" y="696.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">группы: 2 490 и 4 990 руб. в месяц</text><rect x="1253.0" y="625" width="337.0" height="130" rx="8" fill="#DCE3FB" stroke="#1E3FD8" stroke-width="1.5"/><text x="1261.0" y="651.5" font-size="18" font-weight="700" fill="#0A2A8A" text-anchor="start">Кросс-продажи</text><text x="1261.0" y="675.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">ДМС для родителя, Ингосстрах Жизнь</text><text x="1261.0" y="696.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">(полис ухода)</text><rect x="30" y="775" width="150" height="130" rx="8" fill="#0A2A8A"/><text x="38" y="835.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Партнеры вне</text><text x="38" y="855.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">контура</text><rect x="200.0" y="775" width="337.0" height="130" rx="8" fill="#FFFFFF" stroke="#8FA3F0" stroke-width="1.5"/><text x="208.0" y="801.5" font-size="18" font-weight="700" fill="#0A2A8A" text-anchor="start">Лаборатории</text><text x="208.0" y="825.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">2-3 договора на анализы с выездом</text><rect x="551.0" y="775" width="337.0" height="130" rx="8" fill="#FFFFFF" stroke="#8FA3F0" stroke-width="1.5"/><text x="559.0" y="801.5" font-size="18" font-weight="700" fill="#0A2A8A" text-anchor="start">Аптеки и доставка</text><text x="559.0" y="825.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">Доставка лекарств, комиссия 10%</text><rect x="902.0" y="775" width="337.0" height="130" rx="8" fill="#FFFFFF" stroke="#8FA3F0" stroke-width="1.5"/><text x="910.0" y="801.5" font-size="18" font-weight="700" fill="#0A2A8A" text-anchor="start">Поликлиники по ОМС</text><text x="910.0" y="825.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">Запись к врачам, талоны и выписки</text><text x="910.0" y="846.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">для родителя</text><rect x="1253.0" y="775" width="337.0" height="130" rx="8" fill="#FFFFFF" stroke="#8FA3F0" stroke-width="1.5"/><text x="1261.0" y="801.5" font-size="18" font-weight="700" fill="#0A2A8A" text-anchor="start">Работодатель</text><text x="1261.0" y="825.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">B2B2C: опция к корпоративному ДМС,</text><text x="1261.0" y="846.5" font-size="16" font-weight="400" fill="#151B33" text-anchor="start">1 990 руб.</text></svg>