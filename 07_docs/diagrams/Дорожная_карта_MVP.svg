<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 960" width="1640" height="960" font-family="Times New Roman, Times, serif"><title>ИНГОССЕМЬЯ: дорожная карта MVP</title><rect width="1640" height="960" fill="#FFFFFF"/><rect x="0" y="0" width="1640" height="78" rx="0" fill="#0A2A8A"/><rect x="0" y="78" width="1640" height="5" rx="0" fill="#B8F02A"/><text x="36" y="38" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start">ИНГОССЕМЬЯ: дорожная карта MVP на 3 месяца</text><text x="36" y="64" font-size="14" font-weight="400" fill="#C9D3FA" text-anchor="start">12 недель, бюджет 4,87 млн руб. из 5 млн. В конце недели 12 решение о масштабировании</text><rect x="333" y="108" width="394" height="34" rx="8" fill="#1E3FD8"/><text x="530.0" y="130.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Месяц 1: подготовка</text><rect x="733" y="108" width="394" height="34" rx="8" fill="#1E3FD8"/><text x="930.0" y="130.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Месяц 2: запуск на 50 семей</text><rect x="1133" y="108" width="394" height="34" rx="8" fill="#1E3FD8"/><text x="1330.0" y="130.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Месяц 3: рост до 150 семей</text><rect x="333" y="146" width="94" height="24" rx="5" fill="#DCE3FB"/><text x="380.0" y="163" font-size="13" font-weight="700" fill="#0A2A8A" text-anchor="middle">Нед 1</text><rect x="433" y="146" width="94" height="24" rx="5" fill="#DCE3FB"/><text x="480.0" y="163" font-size="13" font-weight="700" fill="#0A2A8A" text-anchor="middle">Нед 2</text><rect x="533" y="146" width="94" height="24" rx="5" fill="#DCE3FB"/><text x="580.0" y="163" font-size="13" font-weight="700" fill="#0A2A8A" text-anchor="middle">Нед 3</text><rect x="633" y="146" width="94" height="24" rx="5" fill="#DCE3FB"/><text x="680.0" y="163" font-size="13" font-weight="700" fill="#0A2A8A" text-anchor="middle">Нед 4</text><rect x="733" y="146" width="94" height="24" rx="5" fill="#DCE3FB"/><text x="780.0" y="163" font-size="13" font-weight="700" fill="#0A2A8A" text-anchor="middle">Нед 5</text><rect x="833" y="146" width="94" height="24" rx="5" fill="#DCE3FB"/><text x="880.0" y="163" font-size="13" font-weight="700" fill="#0A2A8A" text-anchor="middle">Нед 6</text><rect x="933" y="146" width="94" height="24" rx="5" fill="#DCE3FB"/><text x="980.0" y="163" font-size="13" font-weight="700" fill="#0A2A8A" text-anchor="middle">Нед 7</text><rect x="1033" y="146" width="94" height="24" rx="5" fill="#DCE3FB"/><text x="1080.0" y="163" font-size="13" font-weight="700" fill="#0A2A8A" text-anchor="middle">Нед 8</text><rect x="1133" y="146" width="94" height="24" rx="5" fill="#DCE3FB"/><text x="1180.0" y="163" font-size="13" font-weight="700" fill="#0A2A8A" text-anchor="middle">Нед 9</text><rect x="1233" y="146" width="94" height="24" rx="5" fill="#DCE3FB"/><text x="1280.0" y="163" font-size="13" font-weight="700" fill="#0A2A8A" text-anchor="middle">Нед 10</text><rect x="1333" y="146" width="94" height="24" rx="5" fill="#DCE3FB"/><text x="1380.0" y="163" font-size="13" font-weight="700" fill="#0A2A8A" text-anchor="middle">Нед 11</text><rect x="1433" y="146" width="94" height="24" rx="5" fill="#DCE3FB"/><text x="1480.0" y="163" font-size="13" font-weight="700" fill="#0A2A8A" text-anchor="middle">Нед 12</text><rect x="30" y="182" width="1500" height="38" rx="4" fill="#F6F8FE"/><text x="38" y="206.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Юридическая схема согласий (152-ФЗ)</text><rect x="333" y="188" width="294" height="26" rx="6" fill="#1E3FD8"/><text x="38" y="246.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Скрипты и чат-бот в MAX</text><rect x="333" y="228" width="394" height="26" rx="6" fill="#1E3FD8"/><rect x="30" y="262" width="1500" height="38" rx="4" fill="#F6F8FE"/><text x="38" y="286.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Сценарий ежедневного звонка робота</text><rect x="433" y="268" width="294" height="26" rx="6" fill="#1E3FD8"/><text x="38" y="326.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Найм и обучение 3 координаторов</text><rect x="333" y="308" width="394" height="26" rx="6" fill="#1E3FD8"/><rect x="30" y="342" width="1500" height="38" rx="4" fill="#F6F8FE"/><text x="38" y="366.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Лаборатории, пилот с фондом</text><rect x="433" y="348" width="294" height="26" rx="6" fill="#1E3FD8"/><text x="38" y="406.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Лендинг с предоплатой (H2)</text><rect x="533" y="388" width="594" height="26" rx="6" fill="#8FA3F0"/><rect x="30" y="422" width="1500" height="38" rx="4" fill="#F6F8FE"/><text x="38" y="446.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Запуск на 50 семей (H3)</text><rect x="733" y="428" width="394" height="26" rx="6" fill="#B8F02A"/><text x="38" y="486.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Хронометраж триажа (H4)</text><rect x="733" y="468" width="794" height="26" rx="6" fill="#8FA3F0"/><rect x="30" y="502" width="1500" height="38" rx="4" fill="#F6F8FE"/><text x="38" y="526.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Расширение до 150 семей</text><rect x="1133" y="508" width="394" height="26" rx="6" fill="#B8F02A"/><text x="38" y="566.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Тест цены 2 490 и 4 990 руб.</text><rect x="1133" y="548" width="394" height="26" rx="6" fill="#8FA3F0"/><rect x="30" y="582" width="1500" height="38" rx="4" fill="#F6F8FE"/><text x="38" y="606.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">B2B2C-пилоты, 1-2 клиента</text><rect x="1133" y="588" width="394" height="26" rx="6" fill="#B8F02A"/><text x="38" y="646.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Когорты (H5), ветераны (H6)</text><rect x="833" y="628" width="694" height="26" rx="6" fill="#8FA3F0"/><line x1="1527" y1="172" x2="1527" y2="668" stroke="#0A2A8A" stroke-width="3"/><polygon points="1527,668 1511,688 1527,708 1543,688" fill="#B8F02A" stroke="#0A2A8A" stroke-width="2"/><text x="1494" y="694" font-size="14" font-weight="700" fill="#0A2A8A" text-anchor="end">Точка решения, конец недели 12</text><rect x="38" y="682" width="22" height="16" rx="4" fill="#1E3FD8"/><text x="68" y="695" font-size="13" font-weight="400" fill="#151B33" text-anchor="start">Подготовка</text><rect x="188" y="682" width="22" height="16" rx="4" fill="#B8F02A"/><text x="218" y="695" font-size="13" font-weight="400" fill="#151B33" text-anchor="start">Запуск и рост</text><rect x="338" y="682" width="22" height="16" rx="4" fill="#8FA3F0"/><text x="368" y="695" font-size="13" font-weight="400" fill="#151B33" text-anchor="start">Измерение</text><rect x="30" y="728" width="1580" height="212" rx="10" fill="#FFFFFF" stroke="#0A2A8A" stroke-width="2"/><text x="46" y="754" font-size="17" font-weight="700" fill="#0A2A8A" text-anchor="start">Критерии решения о масштабировании (пороги гипотез)</text><rect x="46.0" y="766" width="378.0" height="118" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="54.0" y="789.5" font-size="15" font-weight="700" fill="#0A2A8A" text-anchor="start">H2: платят за организацию</text><text x="54.0" y="812.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Конверсия в предоплату 3%+ от перешедших на</text><text x="54.0" y="832.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">лендинг</text><rect x="436.0" y="766" width="378.0" height="118" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="444.0" y="789.5" font-size="15" font-weight="700" fill="#0A2A8A" text-anchor="start">H3: родитель принимает звонки</text><text x="444.0" y="812.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">70%+ родителей дают согласие, на 80%+ звонков</text><text x="444.0" y="832.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">отвечают</text><rect x="826.0" y="766" width="378.0" height="118" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="834.0" y="789.5" font-size="15" font-weight="700" fill="#0A2A8A" text-anchor="start">H4: триаж держит нагрузку</text><text x="834.0" y="812.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Не больше 49 минут живого времени на семью</text><text x="834.0" y="832.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Базового тарифа в месяц (около 128 семей на</text><text x="834.0" y="852.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">координатора), оценка 4,5+, ни одного</text><text x="834.0" y="872.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">пропущенного тревожного случая</text><rect x="1216.0" y="766" width="378.0" height="118" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="1224.0" y="789.5" font-size="15" font-weight="700" fill="#0A2A8A" text-anchor="start">H5: семьи остаются</text><text x="1224.0" y="812.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Продление на 2-й месяц 75%+, доп. услуги или</text><text x="1224.0" y="832.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">полис у 10%+</text><text x="46" y="907.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Правило (допущение команды): масштабируем, если выполнены H2, H3 и H4 и по H5 продления не ниже порога. Если выполнено не все, меняем цену, сценарий или сегмент и повторяем замер. H1 (60%+ тратят 3+ часа в</text><text x="46" y="927.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">неделю) проверяют интервью и анкета до запуска.</text></svg>