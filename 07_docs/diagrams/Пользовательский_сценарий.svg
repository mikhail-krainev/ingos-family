<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 840" width="1640" height="840" font-family="Times New Roman, Times, serif"><title>ИНГОССЕМЬЯ: пользовательский сценарий</title><rect width="1640" height="840" fill="#FFFFFF"/><rect x="0" y="0" width="1640" height="78" rx="0" fill="#0A2A8A"/><rect x="0" y="78" width="1640" height="5" rx="0" fill="#B8F02A"/><text x="36" y="38" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start">ИНГОССЕМЬЯ: пользовательский сценарий в 7 шагов</text><text x="36" y="64" font-size="14" font-weight="400" fill="#C9D3FA" text-anchor="start">Кто что делает на каждом шаге: ребенок, родитель, координатор и системы Ингосстраха</text><rect x="223.0" y="104" width="196" height="44" rx="8" fill="#1E3FD8"/><circle cx="244" cy="126.0" r="13" fill="#B8F02A"/><text x="244" y="131.0" font-size="14" font-weight="700" fill="#151B33" text-anchor="middle">1</text><text x="262" y="131.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Триггер</text><rect x="425.0" y="104" width="196" height="44" rx="8" fill="#1E3FD8"/><circle cx="446" cy="126.0" r="13" fill="#B8F02A"/><text x="446" y="131.0" font-size="14" font-weight="700" fill="#151B33" text-anchor="middle">2</text><text x="464" y="131.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Подключение</text><rect x="627.0" y="104" width="196" height="44" rx="8" fill="#1E3FD8"/><circle cx="648" cy="126.0" r="13" fill="#B8F02A"/><text x="648" y="131.0" font-size="14" font-weight="700" fill="#151B33" text-anchor="middle">3</text><text x="666" y="131.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Знакомство</text><rect x="829.0" y="104" width="196" height="44" rx="8" fill="#1E3FD8"/><circle cx="850" cy="126.0" r="13" fill="#B8F02A"/><text x="850" y="131.0" font-size="14" font-weight="700" fill="#151B33" text-anchor="middle">4</text><text x="868" y="131.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Ритм</text><rect x="1031.0" y="104" width="196" height="44" rx="8" fill="#1E3FD8"/><circle cx="1052" cy="126.0" r="13" fill="#B8F02A"/><text x="1052" y="131.0" font-size="14" font-weight="700" fill="#151B33" text-anchor="middle">5</text><text x="1070" y="131.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Действие</text><rect x="1233.0" y="104" width="196" height="44" rx="8" fill="#1E3FD8"/><circle cx="1254" cy="126.0" r="13" fill="#B8F02A"/><text x="1254" y="131.0" font-size="14" font-weight="700" fill="#151B33" text-anchor="middle">6</text><text x="1272" y="131.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Ценность</text><rect x="1435.0" y="104" width="196" height="44" rx="8" fill="#1E3FD8"/><circle cx="1456" cy="126.0" r="13" fill="#B8F02A"/><text x="1456" y="131.0" font-size="14" font-weight="700" fill="#151B33" text-anchor="middle">7</text><text x="1474" y="131.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Возврат</text><rect x="30" y="154" width="184" height="128" rx="8" fill="#0A2A8A"/><text x="38" y="214.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Ребенок (35-60 лет,</text><text x="38" y="232.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">платит и решает)</text><rect x="223.0" y="154" width="196" height="128" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="231.0" y="177.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Видит предложение в</text><text x="231.0" y="197.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">IngoMobile, в рассылке</text><text x="231.0" y="217.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">ДМС от работодателя</text><text x="231.0" y="237.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">или слышит от знакомых</text><rect x="425.0" y="154" width="196" height="128" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="433.0" y="177.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">За 5 минут заполняет</text><text x="433.0" y="197.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">профиль родителя в</text><text x="433.0" y="217.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">боте: диагнозы,</text><text x="433.0" y="237.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">лекарства, врачи. Платит</text><text x="433.0" y="257.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">подписку</text><rect x="627.0" y="154" width="196" height="128" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="635.0" y="177.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Ждет подтверждения, что</text><text x="635.0" y="197.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">координатор связался с</text><text x="635.0" y="217.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">мамой или папой</text><rect x="829.0" y="154" width="196" height="128" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="837.0" y="177.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Получает в чате</text><text x="837.0" y="197.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">тревожный сигнал, если</text><text x="837.0" y="217.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">родителю плохо или он</text><text x="837.0" y="237.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">пропустил лекарство</text><rect x="1031.0" y="154" width="196" height="128" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="1039.0" y="177.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Подтверждает запись и</text><text x="1039.0" y="197.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">выбор клиники</text><rect x="1233.0" y="154" width="196" height="128" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="1241.0" y="177.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Читает в чате короткий</text><text x="1241.0" y="197.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">отчет: что сделано, что</text><text x="1241.0" y="217.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">сказал врач, что дальше</text><rect x="1435.0" y="154" width="196" height="128" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="1443.0" y="177.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Раз в месяц смотрит</text><text x="1443.0" y="197.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">сводку о здоровье</text><text x="1443.0" y="217.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">родителя и решает про</text><text x="1443.0" y="237.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">ДМС</text><rect x="30" y="288" width="184" height="128" rx="8" fill="#0A2A8A"/><text x="38" y="339.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Родитель (70+,</text><text x="38" y="357.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">хроническое</text><text x="38" y="375.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">заболевание)</text><rect x="223.0" y="288" width="196" height="128" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="231.0" y="311.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Обострение или</text><text x="231.0" y="331.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">плановый визит.</text><text x="231.0" y="351.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Приложений не</text><text x="231.0" y="371.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">использует</text><rect x="425.0" y="288" width="196" height="128" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="433.0" y="311.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Не участвует: ему ничего</text><text x="433.0" y="331.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">ставить не нужно</text><rect x="627.0" y="288" width="196" height="128" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="635.0" y="311.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Принимает звонок</text><text x="635.0" y="331.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">координатора,</text><text x="635.0" y="351.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">подписывает письменное</text><text x="635.0" y="371.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">согласие на медданные:</text><text x="635.0" y="391.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">СМС-код или бумага</text><rect x="829.0" y="288" width="196" height="128" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="837.0" y="311.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Отвечает роботу каждый</text><text x="837.0" y="331.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">день, живому</text><text x="837.0" y="351.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">координатору раз в</text><text x="837.0" y="371.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">месяц (Расширенный:</text><text x="837.0" y="391.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">каждую неделю)</text><rect x="1031.0" y="288" width="196" height="128" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="1039.0" y="311.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Идет к врачу, принимает</text><text x="1039.0" y="331.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">медсестру или доставку</text><text x="1039.0" y="351.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">лекарств</text><rect x="1233.0" y="288" width="196" height="128" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="1241.0" y="311.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Получает рекомендации</text><text x="1241.0" y="331.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">врача простым языком по</text><text x="1241.0" y="351.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">телефону</text><rect x="1435.0" y="288" width="196" height="128" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="1443.0" y="311.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Сам решает, что видит</text><text x="1443.0" y="331.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">ребенок</text><rect x="30" y="422" width="184" height="128" rx="8" fill="#0A2A8A"/><text x="38" y="473.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Координатор</text><text x="38" y="491.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">(сервисная компания</text><text x="38" y="509.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">группы)</text><rect x="223.0" y="422" width="196" height="128" rx="8" fill="#FAFBFF" stroke="#DCE3FB" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="425.0" y="422" width="196" height="128" rx="8" fill="#E4FAB8" stroke="#8FA3F0" stroke-width="1.5"/><text x="433.0" y="445.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Получает заявку и</text><text x="433.0" y="465.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">данные профиля</text><rect x="627.0" y="422" width="196" height="128" rx="8" fill="#E4FAB8" stroke="#8FA3F0" stroke-width="1.5"/><text x="635.0" y="445.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Звонит родителю,</text><text x="635.0" y="465.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">представляется,</text><text x="635.0" y="485.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">договаривается о</text><text x="635.0" y="505.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">времени звонков</text><rect x="829.0" y="422" width="196" height="128" rx="8" fill="#E4FAB8" stroke="#8FA3F0" stroke-width="1.5"/><text x="837.0" y="445.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Звонит раз в месяц</text><text x="837.0" y="465.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">(Расширенный: каждую</text><text x="837.0" y="485.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">неделю). При жалобе</text><text x="837.0" y="505.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">перезванивает в тот же</text><text x="837.0" y="525.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">день</text><rect x="1031.0" y="422" width="196" height="128" rx="8" fill="#E4FAB8" stroke="#8FA3F0" stroke-width="1.5"/><text x="1039.0" y="445.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Записывает в ОМС через</text><text x="1039.0" y="465.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">регистратуру или в</text><text x="1039.0" y="485.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">партнерскую клинику.</text><text x="1039.0" y="505.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Заказывает выезд</text><text x="1039.0" y="525.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">медсестры</text><rect x="1233.0" y="422" width="196" height="128" rx="8" fill="#E4FAB8" stroke="#8FA3F0" stroke-width="1.5"/><text x="1241.0" y="445.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Готовит и отправляет</text><text x="1241.0" y="465.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">отчет</text><rect x="1435.0" y="422" width="196" height="128" rx="8" fill="#E4FAB8" stroke="#8FA3F0" stroke-width="1.5"/><text x="1443.0" y="445.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Когда потребности</text><text x="1443.0" y="465.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">растут, предлагает ДМС</text><text x="1443.0" y="485.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">или полис ухода</text><rect x="30" y="556" width="184" height="128" rx="8" fill="#1E3FD8"/><text x="38" y="625.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Системы Ингосстраха</text><rect x="223.0" y="556" width="196" height="128" rx="8" fill="#DCE3FB" stroke="#8FA3F0" stroke-width="1.5"/><text x="231.0" y="579.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">IngoMobile, рассылка</text><text x="231.0" y="599.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">ДМС, CRM</text><rect x="425.0" y="556" width="196" height="128" rx="8" fill="#DCE3FB" stroke="#8FA3F0" stroke-width="1.5"/><text x="433.0" y="579.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Чат-бот в MAX, платежи</text><text x="433.0" y="599.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">сервисной компании</text><text x="433.0" y="619.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">группы, CRM</text><rect x="627.0" y="556" width="196" height="128" rx="8" fill="#DCE3FB" stroke="#8FA3F0" stroke-width="1.5"/><text x="635.0" y="579.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Контакт-центр, юристы</text><text x="635.0" y="599.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">(форма согласия)</text><rect x="829.0" y="556" width="196" height="128" rx="8" fill="#DCE3FB" stroke="#8FA3F0" stroke-width="1.5"/><text x="837.0" y="579.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Голосовой робот,</text><text x="837.0" y="599.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">телемедицина (дежурный</text><text x="837.0" y="619.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">врач)</text><rect x="1031.0" y="556" width="196" height="128" rx="8" fill="#DCE3FB" stroke="#8FA3F0" stroke-width="1.5"/><text x="1039.0" y="579.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Сеть клиник ДМС,</text><text x="1039.0" y="599.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">МедРокет, Будь здоров</text><rect x="1233.0" y="556" width="196" height="128" rx="8" fill="#DCE3FB" stroke="#8FA3F0" stroke-width="1.5"/><text x="1241.0" y="579.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">IngoRead разбирает</text><text x="1241.0" y="599.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">выписки в медкарту</text><rect x="1435.0" y="556" width="196" height="128" rx="8" fill="#DCE3FB" stroke="#8FA3F0" stroke-width="1.5"/><text x="1443.0" y="579.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">CRM, ДМС, Ингосстрах</text><text x="1443.0" y="599.5" font-size="15" font-weight="400" fill="#151B33" text-anchor="start">Жизнь</text><rect x="30" y="760" width="1580" height="56" rx="8" fill="#EEF1FD" stroke="#8FA3F0" stroke-width="1.5"/><text x="46" y="793.5" font-size="15" font-weight="700" fill="#0A2A8A" text-anchor="start">Роботу и телемедицине отдана рутина. Поэтому на Базовом тарифе один координатор ведет около 128 семей: 48,3 минуты живого времени на семью в месяц, включая помощь с льготами ветеранов (расчет финмодели).</text></svg>