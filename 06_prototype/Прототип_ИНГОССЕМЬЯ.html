<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ИНГОССЕМЬЯ - прототип</title>
<style>
:root{
  --blue:#1E3FD8; --navy:#0A2A8A; --lime:#B8F02A; --ink:#10182F; --muted:#4A5575;
  --line:#D5DBEE; --bg:#FFFFFF; --soft:#EEF2FF; --sky:#E3EEFF; --red:#B3261E; --redbg:#FDECEA;
  --green:#14683A; --greenbg:#E6F5EC; --amber:#7A4A00; --amberbg:#FFF3D6;
  --r:12px; --r-sm:8px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:#F4F6FC;color:var(--ink);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px;box-shadow:0 0 0 5px #fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3,h4,p{margin:0}

/* top switcher */
.top{background:var(--navy);color:#fff;padding:var(--s3) var(--s5);display:flex;align-items:center;gap:var(--s5);flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{font-weight:700;font-size:18px}
.brand span{background:var(--lime);color:var(--navy);padding:1px 8px;border-radius:6px;margin-left:8px;font-size:13px}
.modes{display:flex;gap:var(--s2);margin:0;padding:0;list-style:none}
.modes button{background:transparent;color:#fff;border:2px solid #7F95E8;border-radius:999px;padding:8px 18px;font-weight:600}
.modes button[aria-selected="true"]{background:#fff;color:var(--navy);border-color:#fff}
.top :focus-visible{outline-color:#fff;box-shadow:none}
.modes .short{display:none}
.mode{display:none}
.mode.on{display:block}
.foot{text-align:center;font-size:12.5px;color:var(--muted);padding:var(--s5) var(--s4)}

/* shared buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--blue);background:var(--blue);color:#fff;border-radius:var(--r-sm);padding:12px 18px;font-weight:600;min-height:44px}
.btn:hover{background:var(--navy);border-color:var(--navy)}
.btn.ghost{background:#fff;color:var(--blue)}
.btn.ghost:hover{background:var(--soft)}
.btn.block{width:100%}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--navy)}
.btn.lime:hover{background:#a5dc1c;border-color:#a5dc1c}
.btn.danger{background:var(--red);border-color:var(--red)}
.btn.sm{padding:8px 12px;min-height:36px;font-size:14px}
.chip{display:inline-block;background:var(--sky);color:var(--navy);border-radius:999px;padding:4px 12px;font-size:14px;border:1px solid #B9CFF5}
button.chip{min-height:36px}
button.chip[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:700}
.tag.red{background:var(--redbg);color:var(--red)}
.tag.amber{background:var(--amberbg);color:var(--amber)}
.tag.green{background:var(--greenbg);color:var(--green)}
.tag.blue{background:var(--sky);color:var(--navy)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;z-index:50;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* ===== wireframes ===== */
.wf-wrap{max-width:1500px;margin:0 auto;padding:var(--s5)}
.wf-wrap>h2{font-size:22px;margin-bottom:4px}
.wf-wrap>p{color:var(--muted);margin-bottom:var(--s5)}
.wf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:var(--s5)}
.wf-item h3{font-size:14px;margin-bottom:var(--s2)}
.wf-screen{background:#fff;border:2px solid #9AA1B5;border-radius:18px;height:420px;padding:12px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.wf-item.wide{grid-column:1/-1}
.wf-item.wide .wf-screen{height:auto;min-height:380px;flex-direction:row;border-radius:8px}
.g{background:#D9DCE5;border-radius:4px}
.g.d{background:#B9BECC}
.g.line{height:8px}
.g.line.s{width:60%}
.g.hd{height:26px;background:#B9BECC}
.g.btn{height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#4b5163;background:#B9BECC;border:0}
.g.card{height:62px;padding:8px;display:flex;flex-direction:column;gap:6px;background:#E8EAF0;border:1px solid #B9BECC}
.g.av{width:30px;height:30px;border-radius:50%;flex:none}
.g.chips{display:flex;gap:6px;background:none}
.g.chips i{display:block;height:18px;width:48px;border-radius:9px;background:#D9DCE5}
.g.bub{height:30px;width:70%}
.g.bub.r{align-self:flex-end;background:#B9BECC}
.g.tabs{height:30px;margin-top:auto;display:flex;gap:6px;background:none}
.g.tabs i{flex:1;background:#D9DCE5;border-radius:4px}
.wf-note{font-size:10px;color:#4b5163}
.wf-col{display:flex;flex-direction:column;gap:8px;flex:1}

/* ===== client mode ===== */
.client{display:flex;gap:var(--s6);justify-content:center;align-items:flex-start;padding:var(--s5) var(--s4);flex-wrap:wrap}
.jump{width:230px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:var(--s4)}
.jump h2{font-size:15px;margin-bottom:var(--s2)}
.jump ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.jump button{width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px;font-size:14px;color:var(--ink)}
.jump button:hover{background:var(--soft)}
.jump button[aria-current="true"]{background:var(--blue);color:#fff}
.dev-switch{display:flex;background:var(--soft);border-radius:10px;padding:3px;margin-bottom:var(--s4)}
.dev-switch button{flex:1;border:0;background:none;border-radius:8px;padding:8px 6px;font-size:14px;font-weight:600;color:var(--muted)}
.dev-switch button[aria-pressed="true"]{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(10,42,138,.18)}
.stage{flex:none;display:flex;justify-content:center}
.stage [hidden]{display:none!important}

/* iPhone 15 Pro frame: 393x852 pt screen */
.iphone{--scr-w:393px;--scr-h:852px;position:relative;flex:none;width:var(--scr-w);height:var(--scr-h);padding:12px;border-radius:68px;
  background:#0B0B0D;box-sizing:content-box;
  box-shadow:0 0 0 3px #8E8A83,0 0 0 4px #5E5A55,0 0 0 5px #B9B4AC,0 30px 60px -20px rgba(10,20,60,.35)}
.iphone .hw{position:absolute;width:4px;background:linear-gradient(90deg,#6E6A64,#B9B4AC 60%,#7E7A74);border-radius:2px}
.iphone .hw.act{left:-9px;top:150px;height:32px}
.iphone .hw.vup{left:-9px;top:214px;height:62px}
.iphone .hw.vdn{left:-9px;top:290px;height:62px}
.iphone .hw.pwr{right:-9px;top:246px;height:98px}
.screen{position:relative;width:var(--scr-w);height:var(--scr-h);border-radius:56px;overflow:hidden;background:#fff;display:flex;flex-direction:column;isolation:isolate}
.sbar{flex:none;height:54px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 46px;
  font:600 17px/1 -apple-system,"SF Pro Text",system-ui,sans-serif;letter-spacing:-.2px}
.sbar .ic{display:flex;gap:6px;align-items:center}
.sbar svg{display:block;fill:#fff}
.island{position:absolute;top:11px;left:50%;width:125px;height:37px;margin-left:-62.5px;background:#000;border-radius:20px;z-index:5}
.island::after{content:"";position:absolute;right:22px;top:12px;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#2A3550,#0A0D18 60%)}
.home-ind{position:absolute;left:50%;bottom:8px;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:#111;z-index:5;pointer-events:none}
.iphone .nav{padding-bottom:22px}
.iphone .scr:last-child{padding-bottom:34px}
.phone-inner{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}

/* desktop browser frame */
.browser{width:1180px;max-width:100%;background:#fff;border:1px solid #C6CCE0;border-radius:12px;overflow:hidden;box-shadow:0 24px 50px -24px rgba(10,20,60,.35);flex:none}
.bchrome{height:44px;display:flex;align-items:center;gap:16px;padding:0 16px;background:#ECEEF4;border-bottom:1px solid #D5DBEE}
.bchrome .dots{display:flex;gap:8px}
.bchrome .dots i{width:12px;height:12px;border-radius:50%;background:#FF5F57}
.bchrome .dots i:nth-child(2){background:#FEBC2E}
.bchrome .dots i:nth-child(3){background:#28C840}
.bchrome .url{flex:1;max-width:520px;margin:0 auto;height:28px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13.5px;color:var(--muted)}
.bchrome .url svg{fill:var(--muted)}
.bapp{display:grid;grid-template-columns:250px 1fr;height:740px}
.dside{background:var(--navy);color:#fff;display:flex;flex-direction:column;gap:var(--s4);padding:var(--s5) var(--s4)}
.dlogo{font-weight:800;font-size:20px}
.dlogo small{display:block;font-weight:500;font-size:12.5px;color:#CBD6FF}
.dparent{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.08);border-radius:var(--r);padding:10px}
.dparent span{font-size:13px;color:#CBD6FF}
.dnav{display:flex;flex-direction:column;gap:4px;list-style:none;margin:0;padding:0}
.dnav button{width:100%;text-align:left;border:0;background:none;color:#fff;border-radius:8px;padding:10px 12px;font-weight:600}
.dnav button:hover{background:rgba(255,255,255,.1)}
.dnav button[aria-current="true"]{background:#fff;color:var(--navy)}
.dsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:st}
.dsteps li{display:flex;gap:10px;align-items:center;color:#CBD6FF;font-weight:600;padding:6px 0}
.dsteps li::before{counter-increment:st;content:counter(st);width:26px;height:26px;border-radius:50%;border:2px solid #7F95E8;display:flex;align-items:center;justify-content:center;font-size:13px}
.dsteps li.on{color:#fff}
.dsteps li.on::before{background:var(--lime);border-color:var(--lime);color:var(--navy)}
.dside .dhelp{margin-top:auto;font-size:13px;color:#CBD6FF}
.dside :focus-visible{outline-color:#fff;box-shadow:none}
.dmain{display:flex;flex-direction:column;min-width:0;background:#F7F8FC}
.dtop{flex:none;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--s5);background:#fff;border-bottom:1px solid var(--line)}
.dtop h1{font-size:20px}
.dtop .user{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.dbody{flex:1;min-height:0;overflow-y:auto;padding:var(--s5)}
.dwrap{max-width:820px;margin:0 auto}
.dbody .scr{overflow:visible;padding:0;flex:none}
.dbody .nav{display:none}
.dbody .tariffs{flex-direction:row;align-items:stretch}
.dbody .tcard{flex:1}
.dbody .sticky-cta{flex-direction:row;align-items:center;flex-wrap:wrap}
.dbody .sticky-cta .btn.block{width:auto;min-width:280px}
.dbody .sticky-cta .legal{flex-basis:100%}
.dhero{display:grid;grid-template-columns:1.1fr 1fr;gap:var(--s5);align-items:center}
.dhero h1{font-size:34px;line-height:1.15;margin-bottom:var(--s3)}
.dhero .lead{font-size:17px;margin-bottom:var(--s5)}
.dhero .vals{display:flex;flex-direction:column;gap:var(--s3)}
.dhero .val{background:#fff}
.dsplit{display:grid;grid-template-columns:400px 1fr;gap:var(--s5);align-items:start}
.dlist{display:flex;flex-direction:column;gap:var(--s3)}
.feedcard[aria-current="true"]{background:var(--soft);box-shadow:0 0 0 2px var(--blue) inset}
.ddetail{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3)}
.ddetail h2{font-size:24px}
.ddetail .sticky-cta{flex-direction:row;margin-top:var(--s3)}
.dchat{height:100%;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dbody.full{padding:var(--s4)}
.dbody .stat{grid-template-columns:repeat(2,1fr)}
.msg-bar{height:52px;flex:none;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px}
.msg-bar .back{background:none;border:0;color:#fff;width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.msg-bar .back::before{content:"";width:10px;height:10px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(45deg);margin-left:4px}
.msg-bar .back[hidden]{display:none}
.msg-bar .t{font-weight:700;flex:1;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-bar .sub{font-size:12px;color:#CBD6FF}
.msg-bar :focus-visible{outline-color:#fff;box-shadow:none}
.scr{flex:1;overflow-y:auto;padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.scr h1{font-size:24px;line-height:1.2}
.scr h2{font-size:18px}
.scr .lead{color:var(--muted)}
.nav{flex:none;display:flex;border-top:1px solid var(--line);background:#fff}
.nav button{flex:1;background:none;border:0;padding:10px 4px;font-size:13px;font-weight:600;color:var(--muted);min-height:52px;border-top:3px solid transparent}
.nav button[aria-current="true"]{color:var(--blue);border-top-color:var(--blue)}
.val{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:var(--r)}
.val .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--lime);color:var(--navy);font-weight:800;display:flex;align-items:center;justify-content:center}
.val b{display:block}
.val span{color:var(--muted);font-size:14.5px}
.hero{background:var(--soft);border-radius:var(--r);padding:var(--s4)}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.field .lbl{font-weight:600;font-size:14px}
.field input,.field select,.field textarea{border:1.5px solid #8A94B5;border-radius:var(--r-sm);padding:10px 12px;background:#fff;min-height:44px;width:100%;min-width:0}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s3)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.med{display:flex;gap:8px;align-items:center}
.med input:first-child{flex:1;min-width:0}
.med input:nth-child(2){flex:none;width:128px}
.tariffs{display:flex;flex-direction:column;gap:var(--s3)}
.tcard{border:2px solid var(--line);border-radius:var(--r);padding:var(--s4);background:#fff;text-align:left;width:100%;display:block}
.tcard[aria-checked="true"]{border-color:var(--blue);background:var(--soft)}
.tcard .p{font-size:22px;font-weight:800;color:var(--navy)}
.tcard .p small{font-size:14px;font-weight:600;color:var(--muted)}
.tcard ul{margin:8px 0 0;padding-left:20px;font-size:14.5px}
.tcard .pay{margin-top:8px;font-size:13.5px;color:var(--muted)}
.status{border-radius:var(--r);padding:var(--s4);display:flex;gap:12px;align-items:flex-start}
.status.wait{background:var(--amberbg);color:var(--amber)}
.status.ok{background:var(--greenbg);color:var(--green)}
.status .dot{flex:none;width:14px;height:14px;border-radius:50%;background:currentColor;margin-top:5px}
.feedcard{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:var(--r);padding:12px 14px}
.feedcard:hover{background:var(--soft)}
.feedcard.warn{border-left-color:var(--red)}
.feedcard.ok{border-left-color:var(--green)}
.feedcard .m{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-bottom:4px}
.feedcard b{display:block;margin-bottom:2px}
.feedcard p{font-size:14.5px}
.who{display:flex;align-items:center;gap:12px}
.ava{flex:none;width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.ava.lg{width:56px;height:56px;font-size:20px}
.ava.lime{background:var(--lime);color:var(--navy)}
.kv{display:flex;flex-direction:column;gap:8px}
.kv div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;text-align:right}
.chat{flex:1;overflow-y:auto;padding:var(--s4);display:flex;flex-direction:column;gap:8px;background:#F4F6FC}
.bubble{max-width:80%;padding:10px 12px;border-radius:14px;font-size:15px}
.bubble.in{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.bubble.out{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.bubble time{display:block;font-size:11.5px;opacity:.75;margin-top:2px}
.composer{flex:none;display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:#fff}
.composer input{flex:1;border:1.5px solid #8A94B5;border-radius:999px;padding:10px 14px;min-height:44px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.stat>div{border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-size:26px;color:var(--navy)}
.stat span{font-size:13.5px;color:var(--muted)}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue)}
.list{margin:0;padding-left:20px;font-size:15px}
.offer{border:1.5px dashed var(--blue);border-radius:var(--r);padding:var(--s4);background:#fff}
.sticky-cta{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.legal{font-size:12.5px;color:var(--muted)}
.benefit{margin:var(--s4) 0;padding:var(--s4);border:2px solid var(--blue);border-radius:var(--r);background:var(--soft)}
.benefit h3{margin:0 0 4px;font-size:16px;color:var(--navy)}
.benefit p{margin:4px 0 10px;font-size:14px}
.tcard .old{font-size:14px;font-weight:600;color:var(--muted);text-decoration:line-through;margin-left:6px}
.benefitbox{margin-top:10px;border-radius:var(--r);padding:10px 12px;background:var(--sky);color:var(--navy);font-size:14.5px}

/* ===== coordinator ===== */
.coord-scroll{overflow-x:auto}
.coord{width:1280px;margin:0 auto;padding:var(--s4)}
.cbar{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 20px;margin-bottom:var(--s4)}
.cbar h1{font-size:20px}
.load{display:flex;align-items:center;gap:12px}
.load .meter{width:160px;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.load .meter i{display:block;height:100%;width:93%;background:var(--blue)}
.load b{color:var(--navy)}
.ccols{display:grid;grid-template-columns:330px 1fr 340px;gap:var(--s4);align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:var(--s4)}
.panel h2{font-size:16px;margin-bottom:var(--s3)}
.panel h3{font-size:14px;margin:var(--s4) 0 var(--s2);color:var(--muted);text-transform:none}
.queue{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.qi{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-left:6px solid #8A94B5;border-radius:var(--r-sm);padding:10px 12px}
.qi.red{border-left-color:var(--red)}
.qi.amber{border-left-color:#C77D00}
.qi[aria-current="true"]{background:var(--soft);border-color:var(--blue);border-left-width:6px}
.qi.red[aria-current="true"]{border-left-color:var(--red)}
.qi .a{display:flex;justify-content:space-between;gap:8px;align-items:center}
.qi small{display:block;color:var(--muted);margin-top:2px}
.phead{display:flex;gap:16px;align-items:center;margin-bottom:var(--s3)}
.phead h2{margin:0;font-size:20px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.alertbox{background:var(--redbg);color:#7A1A14;border-radius:var(--r-sm);padding:10px 12px;margin-bottom:var(--s3);font-size:14.5px}
.alertbox.calm{background:var(--greenbg);color:var(--green)}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.check label{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:var(--r-sm);border:1px solid var(--line);font-size:14.5px}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--blue)}
.check label:has(input:checked){background:var(--greenbg);border-color:#9AD2B0}
.prog{font-size:13.5px;color:var(--muted);margin-bottom:8px}
.tl{list-style:none;margin:0;padding:0;font-size:14px;display:flex;flex-direction:column;gap:6px}
.tl li{border-left:3px solid var(--line);padding-left:10px}
.duty{background:var(--soft);border-radius:var(--r-sm);padding:12px;margin-top:var(--s3)}
.duty p{font-size:14px;margin-top:8px}
.rep{width:100%;min-height:140px;border:1.5px solid #8A94B5;border-radius:var(--r-sm);padding:10px;font-size:14.5px}
.tasks{margin:var(--s2) 0 0;padding:0;list-style:none;font-size:14px;display:flex;flex-direction:column;gap:6px}
.tasks li{background:var(--soft);border-radius:6px;padding:8px 10px}
.field.mt{margin-top:var(--s3)}

@media (max-width:1460px){
  .client{flex-direction:column;align-items:center}
  .jump{width:100%;max-width:1180px;display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3)}
  .jump h2{margin:0}
  .jump .dev-switch{margin:0}
  .jump ol{flex-direction:row;flex-wrap:wrap}
  .jump button{width:auto}
}
@media (max-width:1320px){
  .coord{width:auto;max-width:1280px}
  .ccols{grid-template-columns:300px 1fr}
  .ccols>section:last-child{grid-column:1/-1}
}
@media (max-width:760px){
  .ccols,.cgrid{grid-template-columns:1fr}
  .cbar{flex-direction:column;align-items:flex-start;gap:8px}
  .cbar h1{font-size:18px}
  .load{flex-wrap:wrap}
  .coord{padding:var(--s3)}
}
/* real phone: app fills the screen, no drawn frame */
@media (max-width:700px){
  .top{padding:0;gap:0;height:52px}
  .brand{display:none}
  .top nav{flex:1;height:100%}
  .modes{height:100%;gap:0}
  .modes li{flex:1}
  .modes button{width:100%;height:100%;border:0;border-radius:0;padding:0 4px;font-size:14px;border-bottom:3px solid transparent}
  .modes button[aria-selected="true"]{background:transparent;color:#fff;border-bottom-color:var(--lime)}
  .modes .long{display:none}
  .modes .short{display:inline}
  .client{padding:0;gap:0}
  .jump{border:0;border-radius:0;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .jump::-webkit-scrollbar{display:none}
  .jump h2,.jump .dev-switch{display:none}
  .jump ol{flex-wrap:nowrap;gap:6px}
  .jump button{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px}
  .stage{width:100%}
  .iphone{width:100%;height:calc(100dvh - 52px - 51px);padding:0;border-radius:0;box-shadow:none;background:#fff}
  .iphone .hw,.sbar,.island,.home-ind{display:none}
  .screen{width:100%;height:100%;border-radius:0}
  .iphone .nav{padding-bottom:env(safe-area-inset-bottom)}
  .iphone .scr:last-child{padding-bottom:calc(var(--s4) + env(safe-area-inset-bottom))}
  #m-client .foot{display:none}
  .scr h1{font-size:22px}
  .med input:nth-child(2){width:132px}
  .composer .btn{padding:10px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<body>

<header class="top">

          <div class="screen">
            <div class="sbar" aria-hidden="true"><span>9:41</span><span class="ic">
              <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
              <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.6c2.3 0 4.4.9 6 2.4l1.2-1.2A10.2 10.2 0 0 0 8 .9C5.2.9 2.7 2 .8 3.8L2 5c1.6-1.5 3.7-2.4 6-2.4zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.2A6.8 6.8 0 0 0 8 4.3c-1.9 0-3.6.7-4.8 1.9l1.2 1.2C5.4 6.5 6.6 6 8 6zm0 3.3c.6 0 1.1.2 1.5.6L8 11.4 6.5 9.9c.4-.4.9-.6 1.5-.6z"/></svg>
              <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" stroke-opacity=".45"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill-opacity=".5"/></svg>
            </span></div>
            <span class="island"></span>
            <div class="phone-inner" id="phone"></div>
            <span class="home-ind"></span>
          </div>
        </div>
        <div class="browser" id="browser" hidden>
          <div class="bchrome" aria-hidden="true"><span class="dots"><i></i><i></i><i></i></span>
            <div class="url"><svg width="11" height="13" viewBox="0 0 11 13"><path d="M2.5 5V3.5a3 3 0 0 1 6 0V5h.5A1.5 1.5 0 0 1 10.5 6.5v5A1.5 1.5 0 0 1 9 13H2A1.5 1.5 0 0 1 .5 11.5v-5A1.5 1.5 0 0 1 2 5zm1.5 0h3V3.5a1.5 1.5 0 0 0-3 0z"/></svg>ryadom.ingos.ru</div></div>
          <div class="bapp" id="desk"></div>
        </div>
      </div>
    </div>
    <p class="foot">Прототип для IngoSight 2026, данные вымышлены</p>
  </section>

  <section class="mode" id="m-coord" role="tabpanel" aria-labelledby="tab-coord">
    <div class="coord-scroll"><div class="coord" id="coord"></div></div>
    <p class="foot">Прототип для IngoSight 2026, данные вымышлены</p>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var $ = function(s,r){return (r||document).querySelector(s)};
var $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var toastT;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},3200)}

/* ---------- mode switch ---------- */
function setMode(m){
  $$('.modes button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.mode===m?'true':'false')});
  $$('.mode').forEach(function(s){s.classList.toggle('on',s.id==='m-'+m)});
  try{history.replaceState(null,'','#'+m)}catch(e){}
}
$('#modes').addEventListener('click',function(e){var b=e.target.closest('button[data-mode]');if(b)setMode(b.dataset.mode)});
$('#modes').addEventListener('keydown',function(e){
  var tabs=$$('.modes button'),i=tabs.indexOf(document.activeElement);
  if(i<0)return;
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){var n=tabs[(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length];n.focus();setMode(n.dataset.mode);e.preventDefault()}
});

/* ---------- wireframes ---------- */
var L=function(c){return '<div class="g line '+(c||'')+'"></div>'};
var WF={
  hd:function(t){return '<div class="g hd"></div>'},
  btn:function(t){return '<div class="g btn">'+t+'</div>'},
  card:function(){return '<div class="g card">'+L()+L('s')+'</div>'},
  chips:function(n){var s='';for(var i=0;i<(n||4);i++)s+='<i></i>';return '<div class="g chips">'+s+'</div>'},
  tabs:function(){return '<div class="g tabs"><i></i><i></i><i></i></div>'},
  box:function(h){return '<div class="g" style="height:'+h+'px"></div>'}
};
function screen(title,note,inner){return '<div class="wf-item"><h3>'+title+'</h3><div class="wf-screen">'+inner+'</div><p class="wf-note">'+note+'</p></div>'}
function buildWf(){
  var items=[
    screen('1. Приветствие','Три пункта ценности, одна кнопка',WF.hd()+WF.box(70)+L()+L('s')+WF.card()+WF.card()+WF.card()+'<div style="margin-top:auto">'+WF.btn('Подключить маму или папу')+'</div>'),
    screen('2. Профиль родителя','Имя, возраст, город, диагнозы, лекарства, поликлиника, время звонков',WF.hd()+L()+L()+WF.chips(4)+WF.card()+WF.card()+L()+L('s')+'<div style="margin-top:auto">'+WF.btn('Далее')+'</div>'),
    screen('3. Выбор тарифа','Два тарифа, что входит, что платно отдельно',WF.hd()+'<div class="g card" style="height:110px">'+L()+L('s')+L()+'</div><div class="g card" style="height:110px">'+L()+L('s')+L()+'</div>'+L('s')+'<div style="margin-top:auto">'+WF.btn('Продолжить')+'</div>'),
    screen('4. Согласие родителя','Статус ожидания и пояснение про медданные',WF.hd()+'<div class="g card" style="height:70px">'+L()+L('s')+'</div>'+L()+L()+L('s')+'<div style="margin-top:auto">'+WF.btn('Отправить код повторно')+'</div>'),
    screen('5. Лента событий','Главный экран, карточки событий, нижняя навигация',WF.hd()+WF.card()+WF.card()+WF.card()+WF.card()+WF.tabs()),
    screen('6. Событие подробно','Что произошло, что дальше, две кнопки',WF.hd()+L()+L('s')+WF.box(90)+L()+L()+'<div style="margin-top:auto;display:flex;flex-direction:column;gap:6px">'+WF.btn('Написать координатору')+WF.btn('Позвонить')+'</div>'),
    screen('7. Чат с координатором','Фото-заглушка, сообщения, поле ввода',WF.hd()+'<div style="display:flex;gap:8px;align-items:center"><div class="g av d"></div>'+L('s')+'</div><div class="g bub"></div><div class="g bub r"></div><div class="g bub"></div><div class="g bub r"></div><div style="margin-top:auto" class="g btn">Сообщение</div>'),
    screen('8. Месячная сводка','Звонки, лекарства, визиты, план, предложение ДМС',WF.hd()+'<div style="display:flex;gap:8px"><div class="g card" style="flex:1"></div><div class="g card" style="flex:1"></div></div>'+WF.card()+WF.card()+'<div class="g card" style="height:70px;border-style:dashed"></div>'+WF.tabs())
  ];
  var coord='<div class="wf-item wide"><h3>9. Рабочее место координатора (1280)</h3><div class="wf-screen">'+
    '<div style="width:24%" class="wf-col"><div class="g hd"></div>'+WF.card()+WF.card()+WF.card()+WF.card()+WF.card()+'</div>'+
    '<div style="width:40%" class="wf-col"><div class="g hd"></div><div style="display:flex;gap:8px"><div class="g av d"></div>'+L()+'</div>'+WF.box(60)+WF.box(130)+WF.btn('Подключить дежурного врача')+'</div>'+
    '<div style="width:30%" class="wf-col"><div class="g hd"></div>'+WF.box(100)+WF.btn('Создать задачу')+WF.box(80)+WF.btn('Отправить отчет ребенку')+'</div>'+
    '</div><p class="wf-note">Слева очередь семей с приоритетами, в центре карточка и скрипт звонка, справа задачи и отчет. В шапке счетчик нагрузки.</p></div>';
  $('#m-wf').innerHTML='<div class="wf-wrap"><h2>Вайрфреймы</h2><p>Схемы тех же экранов в низкой детализации. Для документации.</p><div class="wf-grid">'+items.join('')+coord+'</div></div><p class="foot">Прототип для IngoSight 2026, данные вымышлены</p>';
}

/* ---------- client app ---------- */
var SCREENS=[
  ['welcome','Приветствие'],['profile','Профиль родителя'],['tariff','Выбор тарифа'],['consent','Согласие родителя'],
  ['feed','Лента событий'],['event','Карточка события'],['chat','Чат с координатором'],['summary','Месячная сводка']
];
var EVENTS=[
  {id:4,kind:'ok',date:'Сегодня, 09:40',title:'Результаты анализов готовы',short:'Врач телемедицины прокомментировал результаты.',
   body:['Готовы результаты общего и биохимического анализа крови, сданных 20.10 в лаборатории на Советской.','Врач телемедицины Елена Викторовна Орлова посмотрела их и прокомментировала: холестерин чуть выше нормы, остальное в пределах нормы. Срочных действий не требуется.','Что дальше: врач рекомендует показать результаты кардиологу на приеме 28.10. Мы передадим их в поликлинику заранее.']},
  {id:3,kind:'warn',date:'Сегодня, 08:15',title:'Пропуск лекарства',short:'Мама пропустила вечерний прием лекарства 2 дня подряд, координатор перезвонит сегодня.',
   body:['Вечерний прием (эналаприл, 20:00) не отмечен 20.10 и 21.10. Мы напоминали голосом, Галина Петровна не ответила на напоминание.','Возможные причины мы уточним сами: забывает, закончились таблетки или плохо переносит. Давить на маму не будем.','Что дальше: координатор Марина перезвонит маме сегодня в 11:00. Если лекарство закончилось, закажем доставку из аптеки.']},
  {id:2,kind:'info',date:'21.10, 12:05',title:'Записали к кардиологу',short:'28.10, 10:30, поликлиника №7. Талон оформлен.',
   body:['Записали Галину Петровну к кардиологу на 28.10 в 10:30. Городская поликлиника №7, кабинет 214, талон по ОМС.','Нужно взять паспорт, полис и последнюю выписку. Выписку мы подготовим и пришлем вам копию.','Напомним маме за день и за два часа до приема. Если нужна помощь с дорогой, скажите, найдем вариант.']},
  {id:1,kind:'info',date:'21.10, 11:20',title:'Звонок координатора 21.10',short:'Самочувствие нормальное, давление 140/90, напомнили про кардиолога.',
   body:['Марина позвонила Галине Петровне в обычное время, разговор занял 12 минут.','Самочувствие нормальное, жалоб нет. Давление утром 140/90, это немного выше ее обычного. Голова не кружилась.','Напомнили про визит к кардиологу и про вечерние лекарства. Мама сказала, что в аптеку дойдет сама в четверг.']}
];
var CHAT0=[
  {w:'in',t:'Здравствуйте, Андрей. Это Марина, координатор Галины Петровны. Сегодня созвонились с ней, все спокойно.',h:'11:24'},
  {w:'out',t:'Спасибо, Марина. А что с лекарствами по вечерам?',h:'11:31'},
  {w:'in',t:'Уточняю. Завтра в 11:00 перезвоню ей и все выясню. Вам напишу сразу после звонка.',h:'11:33'}
];
var app={device:'phone',stack:['welcome'],tariff:'base',benefit:'none',consent:false,sel:EVENTS[0],chat:CHAT0.slice(),diag:{'Гипертония':1,'Сахарный диабет 2 типа':1,'Остеоартроз':0,'ИБС':0,'Хроническая почечная недостаточность':0},offer:true};
function cur(){return app.stack[app.stack.length-1]}
function go(name,replace){if(replace)app.stack[app.stack.length-1]=name;else app.stack.push(name);render();}
function back(){if(app.stack.length>1){app.stack.pop();render()}}
var MAIN=['feed','summary','chat'];
function navBar(){
  var items=[['feed','Лента'],['summary','Сводка'],['chat','Чат']];
  return '<nav class="nav" aria-label="Разделы">'+items.map(function(i){return '<button data-go-root="'+i[0]+'"'+(cur()===i[0]?' aria-current="true"':'')+'>'+i[1]+'</button>'}).join('')+'</nav>';
}
var BENEFITS=[
 {id:'none',name:'Нет льготы',d:0},
 {id:'fallen',name:'Родитель погибшего участника СВО',d:1,note:'Тариф «Базовый» бесплатно'},
 {id:'svo',name:'Участник СВО на службе',d:0.5,note:'Скидка 50% на время службы и 6 месяцев после'},
 {id:'combat',name:'Ветеран боевых действий, инвалид войны',d:0.3,note:'Скидка 30%'},
 {id:'labor',name:'Родитель ветеран ВОВ или ветеран труда',d:0.1,note:'Скидка 10%'}
];
function benefit(){return BENEFITS.filter(function(b){return b.id===app.benefit})[0]}
function rub(x){return Math.round(x).toLocaleString('ru-RU').replace(/,/g,' ')}
function price(base){var b=benefit();if(b.id==='fallen')return base===2490?0:base-2490;return base*(1-b.d)}
var HERO={h:'Мама или папа далеко, а вы все знаете',p:'Личный координатор организует родителю медпомощь, а вы получаете короткие отчеты в этом чате.'};
var VALS=[['Один человек вместо десяти звонков','Координатор записывает к врачам, напоминает о лекарствах, заказывает анализы.'],
 ['Вы узнаете в тот же день','О пропущенных лекарствах и жалобах на самочувствие сообщаем сразу.'],
 ['Родителю не нужны приложения','Мы звоним на обычный телефон в удобное время.']];
function valCards(){return VALS.map(function(v,i){return '<div class="val"><div class="n">'+(i+1)+'</div><div><b>'+v[0]+'</b><span>'+v[1]+'</span></div></div>'}).join('')}
function welcomeCta(){return '<div class="sticky-cta"><button class="btn block" data-go="profile">Подключить маму или папу</button><p class="legal">Подключение занимает около 5 минут. Оплата только после согласия родителя.</p></div>'}
function feedTag(e){return e.kind==='warn'?'<span class="tag red">Требует внимания</span>':e.kind==='ok'?'<span class="tag green">Готово</span>':'<span class="tag blue">Сделано</span>'}
function feedCard(e,sel){return '<button class="feedcard '+(e.kind==='warn'?'warn':e.kind==='ok'?'ok':'')+'" data-event="'+e.id+'"'+(sel?' aria-current="'+(sel===e)+'"':'')+'><div class="m"><span>'+e.date+'</span>'+feedTag(e)+'</div><b>'+e.title+'</b><p>'+e.short+'</p></button>'}
function parentLine(){return 'Тверь. Тариф '+(app.tariff==='base'?'Базовый':'Расширенный')+(app.benefit!=='none'?'. Льгота: '+benefit().name.toLowerCase():'')}
var TITLES={welcome:'ИНГОССЕМЬЯ',profile:'Профиль родителя',tariff:'Тариф',consent:'Согласие',feed:'Лента событий',event:'Событие',chat:'Марина, координатор',summary:'Сводка за октябрь'};
var VIEW={
welcome:function(){return '<div class="scr"><div class="hero"><h1>'+HERO.h+'</h1><p class="lead" style="margin-top:8px">'+HERO.p+'</p></div>'+valCards()+welcomeCta()+'</div>'},

 '<section class="panel" aria-label="Очередь семей"><h2>Очередь на сегодня</h2><ul class="queue">'+q+'</ul></section>'+
 '<section class="panel" aria-label="Карточка родителя"><div class="phead"><div class="ava lg" aria-hidden="true">'+f.name.split(' ').slice(0,2).map(function(w){return w[0]}).join('')+'</div><div><h2>'+esc(f.name)+'</h2><span class="lead" style="color:var(--muted)">'+f.age+' лет, '+f.city+'. '+esc(f.child)+'</span></div></div>'+
 (f.alert?'<div class="alertbox"><b>Обратите внимание.</b> '+esc(f.alert)+'</div>':'<div class="alertbox calm">Тревожных сигналов нет.</div>')+
 (f.benefit?'<div class="benefitbox"><b>Льгота.</b> '+esc(f.benefit)+'</div>':'')+
 '<div class="cgrid"><div><h3>Диагнозы</h3><div class="chips">'+f.diag.map(function(x){return '<span class="chip">'+x+'</span>'}).join('')+'</div><h3>Лекарства</h3><p style="font-size:14.5px">'+esc(f.meds)+'</p><h3>Поликлиника и время звонков</h3><p style="font-size:14.5px">'+esc(f.clinic)+'. '+esc(f.call)+'</p><h3>Последние события</h3><ul class="tl">'+f.last.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>'+
 '<div><h2>Скрипт звонка координатора</h2><p class="prog" id="prog">Пройдено '+n+' из '+SCRIPT.length+'</p><ul class="check">'+SCRIPT.map(function(s,i){return '<li><label><input type="checkbox" data-chk="'+i+'"'+(d[i]?' checked':'')+'>'+s+'</label></li>'}).join('')+'</ul></div></div>'+
 '<div class="duty"><button class="btn danger" data-act="duty">Подключить дежурного врача</button>'+(co.duty[f.id]?'<p role="status"><b>Дежурный врач телемедицины подключен.</b> Елена Викторовна Орлова позвонит '+(f.name.split(' ')[0]==='Николай'?'Николаю Ивановичу':'пациенту')+' в течение 10 минут. Вы остаетесь на линии, врач ведет разговор.</p>':'<p>Включайте врача при жалобах на самочувствие. Советы по лечению дает только он.</p>')+'</div></section>'+
 '<section class="panel" aria-label="Действия"><h2>Новая задача</h2><form id="tform">'+
 '<div class="field"><label for="tt">Тип</label><select id="tt"><option>Запись к врачу</option><option>Анализы</option><option>Выезд медсестры</option><option>Лекарства</option></select></div>'+
 '<div class="field mt"><label for="tw">Что именно</label><input id="tw" placeholder="Например, кардиолог, ЭКГ"></div>'+
 '<div class="field mt"><label for="td">Срок</label><input id="td" value="до 28.10"></div>'+
 '<button class="btn block mt" style="margin-top:12px" type="submit">Создать задачу</button></form>'+
 (tasks?'<h3>Задачи по семье</h3><ul class="tasks">'+tasks+'</ul>':'')+
 '<h2 style="margin-top:20px">Отчет ребенку</h2><label class="sr" for="rp">Текст отчета</label><textarea class="rep" id="rp">'+esc(buildReport(f))+'</textarea>'+
 '<button class="btn block lime" style="margin-top:8px" data-act="send">Отправить отчет</button>'+(co.sent[f.id]?'<p class="prog" role="status" style="margin-top:8px">Отчет отправлен: '+co.sent[f.id]+'</p>':'')+'</section>'+
 '</div>';
}
$('#coord').addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.dataset.fam){co.sel=+b.dataset.fam;renderCoord();var x=$('[data-fam="'+co.sel+'"]');if(x)x.focus();return}
 if(b.dataset.act==='duty'){co.duty[co.sel]=true;renderCoord();toast('Дежурный врач подключен');return}
 if(b.dataset.act==='send'){var f=famBy(co.sel);co.sent[co.sel]='сегодня, 12:10, '+f.child.split(',')[0];renderCoord();toast('Отчет отправлен: '+f.child.split(',')[0]);return}
});
$('#coord').addEventListener('change',function(e){
 if(e.target.dataset.chk===undefined)return;
 ck(co.sel)[+e.target.dataset.chk]=e.target.checked;
 var f=famBy(co.sel),p=$('#prog');p.textContent='Пройдено '+doneCount(co.sel)+' из '+SCRIPT.length;
 var r=$('#rp');if(r)r.value=buildReport(f);
});
$('#coord').addEventListener('submit',function(e){
 e.preventDefault();var w=$('#tw').value.trim();
 if(!w){toast('Укажите, что именно нужно сделать');$('#tw').focus();return}
 var t=$('#tt').value+': '+w+', '+$('#td').value;
 (co.tasks[co.sel]=co.tasks[co.sel]||[]).push(t);renderCoord();toast('Задача создана');
});

/* init */
buildWf();render();renderCoord();
var h=(location.hash||'').slice(1);if(h==='wf'||h==='client'||h==='coord')setMode(h);
})();
</script>
</body>
</html>
